<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Green Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Laser Beam Glow -->
    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 34px; fill: #ffffff; }
    .sub-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #a7f3d0; }
    .badge-text { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 700; font-size: 10.5px; fill: #6ee7b7; }
    .hud-title { font-family: monospace; font-size: 10px; font-weight: 700; fill: #34d399; }
    .hud-label { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #cbd5e1; }
    .hud-val { font-family: monospace; font-size: 11px; font-weight: 700; fill: #34d399; }
  </style>

  <!-- Container Base -->
  <rect width="796" height="236" x="2" y="2" rx="16" fill="url(#bg-grad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Grid Overlay -->
  <rect width="796" height="236" x="2" y="2" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="650" cy="40" r="100" fill="#10b981" fill-opacity="0.18">
    <animate attributeName="r" values="80;115;80" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="200" r="80" fill="#059669" fill-opacity="0.15">
    <animate attributeName="r" values="70;95;70" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Laser Scanner Beam -->
  <g>
    <rect x="0" y="2" width="6" height="236" fill="url(#laser-glow)">
      <animate attributeName="x" values="2;790;2" dur="4s" repeatCount="indefinite" />
    </rect>
    <line x1="0" y1="2" x2="0" y2="238" stroke="#34d399" stroke-width="2">
      <animate attributeName="x1" values="5;793;5" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="5;793;5" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(36, 40)">
    <!-- Main Title -->
    <text x="0" y="30" class="title-text">🌱 FRESH<tspan fill="#34d399">FLOW</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="56" class="sub-text">Autonomous Vision AI Produce Diagnostic &amp; Circular Supply Chain</text>
    <text x="0" y="74" class="sub-text" fill-opacity="0.8">Empowering farms and rescue buyers with real-time freshness scoring.</text>

    <!-- Badges -->
    <g transform="translate(0, 96)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="28" rx="8" fill="#064e3b" fill-opacity="0.7" stroke="#34d399" stroke-opacity="0.4" />
      <circle cx="14" cy="14" r="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="18" class="badge-text">VISION TRANSFORMER</text>

      <!-- Badge 2 -->
      <rect x="175" y="0" width="125" height="28" rx="8" fill="#064e3b" fill-opacity="0.7" stroke="#34d399" stroke-opacity="0.4" />
      <text x="187" y="18" class="badge-text">⚡ 42MS LATENCY</text>

      <!-- Badge 3 -->
      <rect x="310" y="0" width="135" height="28" rx="8" fill="#064e3b" fill-opacity="0.7" stroke="#34d399" stroke-opacity="0.4" />
      <text x="322" y="18" class="badge-text">📦 QR PASSPORT</text>
    </g>
  </g>

  <!-- Right Side AI HUD Card -->
  <g transform="translate(525, 26)">
    <!-- HUD Box Base -->
    <rect width="235" height="184" rx="14" fill="#022c22" fill-opacity="0.85" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" />

    <!-- Top Status Line -->
    <text x="16" y="24" class="hud-title">AI CAMERA HUD v4.2</text>
    <text x="180" y="24" class="hud-title" fill="#34d399">LIVE 🟢</text>
    <line x1="16" y1="32" x2="219" y2="32" stroke="#34d399" stroke-opacity="0.2" stroke-width="1" />

    <!-- Item 1: Detected -->
    <text x="16" y="52" class="hud-label">Detected:</text>
    <text x="219" y="52" class="hud-val" text-anchor="end">Honeycrisp Apple</text>

    <!-- Item 2: Freshness Score -->
    <text x="16" y="74" class="hud-label">Freshness Index:</text>
    <text x="219" y="74" class="hud-val" text-anchor="end">94.8% (Grade A)</text>

    <!-- Progress Bar BG -->
    <rect x="16" y="84" width="203" height="7" rx="3.5" fill="#064e3b" fill-opacity="0.6" />
    <!-- Progress Bar Fill -->
    <rect x="16" y="84" width="190" height="7" rx="3.5" fill="url(#bar-grad)">
      <animate attributeName="width" values="170;196;170" dur="3s" repeatCount="indefinite" />
    </rect>

    <line x1="16" y1="104" x2="219" y2="104" stroke="#34d399" stroke-opacity="0.2" stroke-width="1" />

    <!-- Item 3: Metrics -->
    <text x="16" y="124" class="hud-label">Shelf Life Remaining:</text>
    <text x="219" y="124" class="hud-val" text-anchor="end">7 Days</text>

    <text x="16" y="144" class="hud-label">Brix Sugar Index:</text>
    <text x="219" y="144" class="hud-val" text-anchor="end">12.4° Optimal</text>

    <text x="16" y="164" class="hud-label">Carbon Saved:</text>
    <text x="219" y="164" class="hud-val" text-anchor="end">1,125 kg CO₂</text>
  </g>
</svg>
