<svg fill="none" viewBox="0 0 800 240" width="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: linear-gradient(135deg, #064e3b 0%, #022c22 50%, #090d16 100%);
          border-radius: 20px;
          border: 1px solid rgba(16, 185, 129, 0.3);
          box-shadow: 0 0 35px rgba(16, 185, 129, 0.25), inset 0 0 20px rgba(16, 185, 129, 0.15);
          height: 238px;
          width: 798px;
          position: relative;
          overflow: hidden;
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          box-sizing: border-box;
          padding: 24px 32px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        /* Grid Background Pattern */
        .grid-bg {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(16, 185, 129, 0.07) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(16, 185, 129, 0.07) 1px, transparent 1px);
          background-size: 24px 24px;
          pointer-events: none;
        }

        /* Laser Sweep Animation */
        .laser-sweep {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 4px;
          background: #34d399;
          box-shadow: 0 0 25px 8px #10b981, 0 0 50px 15px #34d399;
          opacity: 0.85;
          animation: sweep 4s ease-in-out infinite alternate;
          pointer-events: none;
        }

        @keyframes sweep {
          0% { left: 0%; }
          100% { left: 100%; }
        }

        /* Ambient Glowing Orbs */
        .glow-orb-1 {
          position: absolute;
          top: -40px;
          right: 20%;
          width: 180px;
          height: 180px;
          background: #10b981;
          filter: blur(80px);
          opacity: 0.35;
          animation: pulse 3s ease-in-out infinite alternate;
        }

        .glow-orb-2 {
          position: absolute;
          bottom: -40px;
          left: 10%;
          width: 150px;
          height: 150px;
          background: #059669;
          filter: blur(70px);
          opacity: 0.25;
          animation: pulse 4s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulse {
          0% { opacity: 0.2; transform: scale(0.9); }
          100% { opacity: 0.45; transform: scale(1.15); }
        }

        /* Text & Branding Styles */
        .title {
          font-size: 38px;
          font-weight: 900;
          color: #ffffff;
          letter-spacing: -0.5px;
          margin: 0;
          display: flex;
          align-items: center;
          gap: 12px;
          text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .highlight {
          background: linear-gradient(90deg, #34d399, #10b981, #6ee7b7);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 12px rgba(52, 211, 153, 0.3));
        }

        .subtitle {
          color: #a7f3d0;
          font-size: 14px;
          margin-top: 8px;
          font-weight: 500;
          max-width: 440px;
          line-height: 1.5;
        }

        .badge-bar {
          display: flex;
          gap: 10px;
          margin-top: 18px;
        }

        .badge {
          background: rgba(6, 78, 59, 0.7);
          border: 1px solid rgba(52, 211, 153, 0.4);
          color: #6ee7b7;
          font-family: 'SFMono-Regular', Consolas, monospace;
          font-size: 11px;
          font-weight: 700;
          padding: 6px 12px;
          border-radius: 8px;
          display: flex;
          align-items: center;
          gap: 6px;
          backdrop-filter: blur(8px);
        }

        .pulse-dot {
          width: 8px;
          height: 8px;
          background: #34d399;
          border-radius: 50%;
          box-shadow: 0 0 8px #34d399;
          animation: blink 1.5s infinite;
        }

        @keyframes blink {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.3; transform: scale(0.7); }
        }

        /* Right Scanner Graphic HUD */
        .hud-card {
          background: rgba(2, 44, 34, 0.75);
          border: 1px solid rgba(52, 211, 153, 0.35);
          border-radius: 16px;
          padding: 16px;
          width: 240px;
          backdrop-filter: blur(12px);
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
          position: relative;
        }

        .hud-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-family: monospace;
          font-size: 10px;
          color: #34d399;
          border-bottom: 1px solid rgba(52, 211, 153, 0.2);
          padding-bottom: 8px;
          margin-bottom: 10px;
        }

        .hud-item {
          display: flex;
          justify-content: space-between;
          font-size: 12px;
          margin-bottom: 6px;
          color: #e2e8f0;
        }

        .hud-val {
          font-family: monospace;
          font-weight: 700;
          color: #34d399;
        }

        .progress-bar-bg {
          height: 6px;
          background: rgba(16, 185, 129, 0.2);
          border-radius: 3px;
          overflow: hidden;
          margin-top: 4px;
        }

        .progress-bar-fill {
          height: 100%;
          width: 94%;
          background: linear-gradient(90deg, #10b981, #34d399);
          box-shadow: 0 0 10px #34d399;
          animation: grow 2s ease-out infinite alternate;
        }

        @keyframes grow {
          0% { width: 85%; }
          100% { width: 96%; }
        }
      </style>
      <div class="container">
        <div class="grid-bg"></div>
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
        <div class="laser-sweep"></div>

        <!-- Left Content -->
        <div style="z-index: 2;">
          <div class="title">
            <span>🌱 FRESH<span class="highlight">FLOW</span></span>
          </div>
          <div class="subtitle">
            Next-Gen Autonomous Produce Quality Scanner, Rescue Marketplace &amp; Circular Supply Chain Intelligence.
          </div>
          <div class="badge-bar">
            <div class="badge">
              <div class="pulse-dot"></div>
              <span>VISION TRANSFORMER AI</span>
            </div>
            <div class="badge">
              <span>⚡ 42MS INFERENCE</span>
            </div>
            <div class="badge">
              <span>📦 QR TRACEABILITY</span>
            </div>
          </div>
        </div>

        <!-- Right HUD Display -->
        <div class="hud-card" style="z-index: 2;">
          <div class="hud-header">
            <span>AI CAMERA HUD v4.2</span>
            <span>LIVE 🟢</span>
          </div>
          <div class="hud-item">
            <span>Detected:</span>
            <span class="hud-val">Honeycrisp Apple</span>
          </div>
          <div class="hud-item">
            <span>Freshness Index:</span>
            <span class="hud-val">94.8% (Grade A)</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
          </div>
          <div style="margin-top: 10px; display: flex; justify-content: space-between; font-size: 10px; font-family: monospace; color: #a7f3d0;">
            <span>Shelf Life: 7 Days</span>
            <span>Brix: 12.4°</span>
          </div>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
